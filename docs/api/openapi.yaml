openapi: 3.0.3
info:
  title: Тёплый дом. API устройств и телеметрии
  version: 1.0.0
  description: |
    Учебный контракт пяти операций целевой системы. Адреса `.example` условные.
    Формат данных: JSON. Время передаётся в UTC, идентификаторы в формате UUID.

    Пользовательские запросы приходят через API Gateway. Межсервисные вызовы
    идут напрямую. JWT определяет пользователя или служебного клиента.
    Для чтения достаточно доступа к дому, для подключения и команд нужны
    права владельца или manager. Права проверяет сервис «Дома и доступ».
    Если проверка прав недоступна, операция не выполняется и возвращается 503.

    Дом устройства определяется через Module.house_id. Поля house_id и
    capabilities в ответе Device получены из модуля и типа устройства.
    Состояние оборудования меняется через команду. Успех возвращается после
    ответа устройства, при тайм-ауте результат команды считается неизвестным.
servers:
  - url: https://devices.warmhouse.example/api/v1
    description: Сервис устройств, условный адрес
tags:
  - name: Устройства
    description: Подключение оборудования, команды и свежие показания
  - name: Телеметрия
    description: Сохранённые измерения для пользователя и сценариев
security:
  - bearerAuth: []

paths:
  /devices:
    post:
      tags: [Устройства]
      operationId: registerDevice
      summary: Подключить устройство к модулю дома
      description: |
        Вызывает веб-приложение через API Gateway. Модуль и тип уже существуют.
        Одноразовый код подтверждает владение устройством и должен соответствовать
        его серийному номеру и типу. Код не сохраняется в открытом виде и не возвращается.
        Повторное подключение того же серийного номера возвращает 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
            examples:
              thermostat:
                summary: Подключение термостата
                value:
                  module_id: b1111111-1111-4111-8111-111111111111
                  type_id: c1111111-1111-4111-8111-111111111111
                  serial_number: TH-000123
                  name: Термостат в гостиной
                  activation_code: WH-7K2M-9P4R
      responses:
        '201':
          description: Устройство подключено
          headers:
            Location:
              description: Адрес созданного устройства
              schema:
                type: string
                example: /api/v1/devices/d1111111-1111-4111-8111-111111111111
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                thermostat:
                  $ref: '#/components/examples/Thermostat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Устройство уже подключено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyRegistered:
                  value:
                    code: device_already_registered
                    message: Устройство с таким серийным номером уже подключено.
        '422':
          description: Код подключения недействителен или не соответствует устройству
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidActivationCode:
                  value:
                    code: invalid_activation_code
                    message: Код подключения недействителен или уже использован.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /devices/{device_id}:
    get:
      tags: [Устройства]
      operationId: getDevice
      summary: Получить сведения об устройстве
      description: |
        Возвращает сведения из реестра и последнее известное состояние.
        Используется веб-приложением и сервисами управления для проверки
        дома, типа и возможностей устройства. Оборудование не опрашивается.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Сведения об устройстве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                thermostat:
                  $ref: '#/components/examples/Thermostat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /devices/{device_id}/commands:
    post:
      tags: [Устройства]
      operationId: executeDeviceCommand
      summary: Выполнить команду устройства
      description: |
        Вызывают сервисы отопления, освещения и ворот с подтверждёнными
        полномочиями пользователя. Прямой пользовательский вызов возвращает 403.
        Сервис проверяет дом, права и поддержку команды в DeviceType.capabilities.

        command_id создаёт вызывающий сервис. Повтор завершённой команды с тем же
        ID и данными возвращает сохранённый результат без повторного выполнения.
        Другой запрос с тем же ID или ещё выполняющаяся команда возвращает 409.
        При 504 состояние неизвестно: устройство могло выполнить команду.
        Повтор после 504 использует тот же ID; устройство устраняет дубли по нему.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
            examples:
              setTemperature:
                summary: Установить температуру 22 °C
                value:
                  command_id: e1111111-1111-4111-8111-111111111111
                  command: set_temperature
                  parameters:
                    temperature: 22
              turnOff:
                summary: Выключить отопление
                value:
                  command_id: e2222222-2222-4222-8222-222222222222
                  command: turn_off
                  parameters: {}
      responses:
        '200':
          description: Устройство подтвердило выполнение команды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
              examples:
                completed:
                  value:
                    command_id: e1111111-1111-4111-8111-111111111111
                    device_id: d1111111-1111-4111-8111-111111111111
                    status: succeeded
                    device_status: 'on'
                    completed_at: '2026-11-14T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Конфликт command_id или команда ещё выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idReused:
                  value:
                    code: command_id_conflict
                    message: Этот command_id уже используется для другого запроса.
                inProgress:
                  value:
                    code: command_in_progress
                    message: Команда ещё выполняется. Повторите запрос позже с тем же command_id.
        '422':
          description: Команда или параметры не поддерживаются, либо устройство отклонило команду
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unsupportedCommand:
                  value:
                    code: unsupported_command
                    message: Устройство не поддерживает эту команду.
                invalidTemperature:
                  value:
                    code: invalid_command_parameters
                    message: Температура выходит за допустимый диапазон устройства.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          description: Ответ устройства не получен, результат выполнения неизвестен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandTimeout'
              examples:
                unknownResult:
                  value:
                    code: device_timeout
                    message: Ответ устройства не получен. Повтор использует тот же command_id.
                    command_id: e1111111-1111-4111-8111-111111111111
                    device_id: d1111111-1111-4111-8111-111111111111
                    status: unknown

  /devices/{device_id}/readings:
    get:
      tags: [Устройства]
      operationId: readDeviceMeasurements
      summary: Запросить свежие показания у оборудования
      description: |
        Вызывает сборщик сервиса телеметрии по таймеру. Нужен служебный JWT
        с разрешением на сбор показаний в данном доме; пользовательский JWT не подходит.
        Адаптер опрашивает устройство по HTTP. При ошибке старое значение
        не выдаётся за новое. Если показания не поддерживаются, возвращается 422.
        Записи TelemetryData создаёт сервис телеметрии после успешного ответа.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Свежие показания устройства
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/Reading'
              examples:
                temperature:
                  value:
                    items:
                      - device_id: d1111111-1111-4111-8111-111111111111
                        house_id: a1111111-1111-4111-8111-111111111111
                        metric: temperature
                        value: 21.5
                        unit: celsius
                        measured_at: '2026-11-14T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Устройство не поддерживает чтение показаний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noReadings:
                  value:
                    code: readings_not_supported
                    message: Устройство не предоставляет показания датчиков.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          description: Устройство не ответило на запрос показаний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                timeout:
                  value:
                    code: device_timeout
                    message: Не удалось получить свежие показания устройства.

  /telemetry:
    get:
      tags: [Телеметрия]
      operationId: getTelemetry
      summary: Получить последние сохранённые измерения
      servers:
        - url: https://telemetry.warmhouse.example/api/v1
          description: Сервис телеметрии, условный адрес
      description: |
        Вызывают веб-приложение и сервис сценариев с правами владельца сценария.
        Читает сохранённые записи без опроса оборудования. Проверяется доступ к дому.
        Фильтры применяются совместно. Если измерений нет, возвращается items: [].
        Записи упорядочены по measured_at, затем id по убыванию.
        Для последнего значения датчика задайте device_id, metric и limit=1.
        Сценарии проверяют свежесть по measured_at.
      parameters:
        - name: house_id
          in: query
          required: true
          description: Дом, к которому нужен доступ
          schema:
            $ref: '#/components/schemas/Uuid'
          examples:
            house:
              value: a1111111-1111-4111-8111-111111111111
        - name: device_id
          in: query
          description: Фильтр по устройству внутри указанного дома
          schema:
            $ref: '#/components/schemas/Uuid'
          examples:
            thermostat:
              value: d1111111-1111-4111-8111-111111111111
        - name: metric
          in: query
          description: Название показателя
          schema:
            type: string
            minLength: 1
            maxLength: 64
          examples:
            temperature:
              value: temperature
        - name: limit
          in: query
          description: Максимальное число последних записей
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          examples:
            latest:
              value: 1
      responses:
        '200':
          description: Последние измерения, соответствующие фильтрам
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/TelemetryData'
              examples:
                temperature:
                  value:
                    items:
                      - id: 1
                        device_id: d1111111-1111-4111-8111-111111111111
                        house_id: a1111111-1111-4111-8111-111111111111
                        metric: temperature
                        value: 21.5
                        unit: celsius
                        measured_at: '2026-11-14T10:00:00Z'
                empty:
                  value:
                    items: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Пользовательский или служебный JWT, в зависимости от операции

  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Идентификатор устройства
      schema:
        $ref: '#/components/schemas/Uuid'
      examples:
        thermostat:
          value: d1111111-1111-4111-8111-111111111111

  schemas:
    Uuid:
      type: string
      format: uuid

    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [module_id, type_id, serial_number, name, activation_code]
      properties:
        module_id:
          $ref: '#/components/schemas/Uuid'
        type_id:
          $ref: '#/components/schemas/Uuid'
        serial_number:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100
        activation_code:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Одноразовый код из комплекта устройства

    Device:
      type: object
      required: [id, module_id, type_id, house_id, serial_number, name, status, capabilities]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        module_id:
          $ref: '#/components/schemas/Uuid'
        type_id:
          $ref: '#/components/schemas/Uuid'
        house_id:
          type: string
          format: uuid
          readOnly: true
          description: Вычисляется через модуль устройства
        serial_number:
          type: string
        name:
          type: string
        status:
          type: string
          description: Последнее известное состояние, например on, off, locked, unlocked или unknown
        capabilities:
          type: object
          readOnly: true
          description: Возможности из справочника DeviceType
          required: [commands, metrics]
          properties:
            commands:
              type: array
              items:
                type: string
            metrics:
              type: array
              items:
                type: string

    CommandRequest:
      oneOf:
        - $ref: '#/components/schemas/TemperatureCommand'
        - $ref: '#/components/schemas/SimpleCommand'

    TemperatureCommand:
      type: object
      additionalProperties: false
      required: [command_id, command, parameters]
      properties:
        command_id:
          $ref: '#/components/schemas/Uuid'
        command:
          type: string
          enum: [set_temperature]
        parameters:
          type: object
          additionalProperties: false
          required: [temperature]
          properties:
            temperature:
              type: number
              description: Температура в градусах Цельсия, допустимый диапазон зависит от устройства

    SimpleCommand:
      type: object
      additionalProperties: false
      required: [command_id, command, parameters]
      properties:
        command_id:
          $ref: '#/components/schemas/Uuid'
        command:
          type: string
          enum: [turn_on, turn_off, lock, unlock]
        parameters:
          type: object
          additionalProperties: false
          maxProperties: 0
          description: Для этих команд параметры не нужны, передаётся пустой объект

    CommandResult:
      type: object
      required: [command_id, device_id, status, device_status, completed_at]
      properties:
        command_id:
          $ref: '#/components/schemas/Uuid'
        device_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [succeeded]
        device_status:
          type: string
          description: Состояние, подтверждённое устройством после команды
        completed_at:
          type: string
          format: date-time

    CommandTimeout:
      type: object
      required: [code, message, command_id, device_id, status]
      properties:
        code:
          type: string
          enum: [device_timeout]
        message:
          type: string
        command_id:
          $ref: '#/components/schemas/Uuid'
        device_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [unknown]

    Reading:
      type: object
      required: [device_id, house_id, metric, value, unit, measured_at]
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
        house_id:
          $ref: '#/components/schemas/Uuid'
        metric:
          type: string
        value:
          type: number
        unit:
          type: string
        measured_at:
          type: string
          format: date-time
          description: Время самого измерения, сохраняется без подмены временем чтения API

    TelemetryData:
      allOf:
        - $ref: '#/components/schemas/Reading'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              minimum: 1

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
        message:
          type: string
          description: Понятное описание ошибки

  examples:
    Thermostat:
      summary: Термостат с измерением температуры
      value:
        id: d1111111-1111-4111-8111-111111111111
        module_id: b1111111-1111-4111-8111-111111111111
        type_id: c1111111-1111-4111-8111-111111111111
        house_id: a1111111-1111-4111-8111-111111111111
        serial_number: TH-000123
        name: Термостат в гостиной
        status: 'off'
        capabilities:
          commands: [set_temperature, turn_on, turn_off]
          metrics: [temperature]

  responses:
    BadRequest:
      description: Некорректный JSON, формат параметров или структура запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              value:
                code: invalid_request
                message: Проверьте обязательные поля, формат UUID и типы значений.
    Unauthorized:
      description: JWT отсутствует, недействителен или истёк
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                code: unauthorized
                message: Требуется действующий JWT.
    Forbidden:
      description: Нет прав на дом или вызов этой операции
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: forbidden
                message: Недостаточно прав для выполнения операции.
    NotFound:
      description: Запрошенное устройство, дом, модуль или тип не найдены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                code: not_found
                message: Запрошенный объект не найден.
    InternalError:
      description: Непредвиденная ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internalError:
              value:
                code: internal_error
                message: Не удалось обработать запрос.
    ServiceUnavailable:
      description: Необходимый для операции сервис недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unavailable:
              value:
                code: service_unavailable
                message: Зависимый сервис временно недоступен.
